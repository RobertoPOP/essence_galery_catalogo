<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Essence Gallery | Catálogo de Perfumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css?v=20260810b">
</head>
<body>

<div class="eg-app">

  <!-- ===== Topbar ===== -->
  <header class="eg-topbar">
    <img src="assets/logo.png" alt="Essence Gallery" class="eg-topbar-logo">
    <span class="eg-topbar-name">ESSENCE GALLERY</span>
  </header>

  <!-- ===== VIEW: INICIO ===== -->
  <main class="eg-view" id="view-inicio">

    <section class="eg-hero">
      <div class="eg-hero-tag">COLECCIÓN 2026</div>
      <h1 class="eg-hero-title">Cada<br>fragancia,<br><span class="eg-hero-em">en detalle</span></h1>
      <div class="eg-hero-actions">
        <button class="eg-btn-gold" id="btnVerCatalogo">Ver catálogo</button>
        <button class="eg-btn-round" id="btnVerCatalogo2" aria-label="Ver catálogo">↗</button>
      </div>
    </section>

    <div class="eg-marquee">
      <div class="eg-marquee-track" id="marqueeTrack"></div>
    </div>

    <section class="eg-bento">
      <button class="eg-bento-card eg-bento-genero" data-genero="Hombre">
        <span class="eg-bento-avatar">É</span>
        <span class="eg-bento-genero-info">
          <span class="eg-bento-genero-label">Hombre</span>
          <span class="eg-bento-genero-count" id="countHombre">0</span>
        </span>
      </button>

      <button class="eg-bento-card eg-bento-genero" data-genero="Mujer">
        <span class="eg-bento-avatar">E</span>
        <span class="eg-bento-genero-info">
          <span class="eg-bento-genero-label">Mujer</span>
          <span class="eg-bento-genero-count" id="countMujer">0</span>
        </span>
      </button>

      <button class="eg-bento-card eg-bento-destacado" id="btnDestacado">
        <span class="eg-bento-destacado-img" id="destacadoImgWrap">
          <img id="destacadoImg" alt="">
        </span>
        <span class="eg-bento-destacado-info">
          <span class="eg-bento-destacado-tag">DEL MES</span>
          <span class="eg-bento-destacado-name" id="destacadoNombre"></span>
          <span class="eg-bento-destacado-sub" id="destacadoSub"></span>
          <span class="eg-bento-destacado-price" id="destacadoPrecio"></span>
        </span>
      </button>

      <div class="eg-bento-card eg-bento-tipos">
        <div class="eg-bento-tipos-tag">TIPOS</div>
        <div class="eg-bento-tipos-pills" id="tiposPills"></div>
      </div>
    </section>

  </main>

  <!-- ===== VIEW: CATALOGO ===== -->
  <main class="eg-view eg-hidden" id="view-catalogo">

    <div class="eg-cat-head">
      <h1 class="eg-cat-title">Catálogo</h1>
      <span class="eg-cat-count" id="catCount">0</span>
    </div>

    <div class="eg-search-wrap">
      <span class="eg-search-icon">◌</span>
      <input type="search" id="searchInput" class="eg-search-input" placeholder="Buscar nombre, marca o tipo">
    </div>

    <div class="eg-pills-row" id="generoPills">
      <button class="eg-pill eg-pill-dark active" data-genero="Todos">Todos</button>
      <button class="eg-pill" data-genero="Hombre">Hombre</button>
      <button class="eg-pill" data-genero="Mujer">Mujer</button>
      <button class="eg-pill eg-pill-filter" id="btnOpenFiltros">Filtros <span id="filtrosBadge" class="eg-filtros-badge eg-hidden"></span></button>
    </div>

    <div class="eg-grid" id="perfumeGrid"></div>
    <p class="eg-empty eg-hidden" id="emptyMsg">No se encontraron perfumes con esos filtros.</p>

  </main>

  <!-- ===== VIEW: MARCAS ===== -->
  <main class="eg-view eg-hidden" id="view-marcas">
    <div class="eg-cat-head">
      <h1 class="eg-cat-title">Marcas</h1>
      <span class="eg-cat-count" id="marcasCount">0</span>
    </div>
    <div class="eg-marcas-grid" id="marcasGrid"></div>
  </main>

  <!-- ===== Bottom nav ===== -->
  <nav class="eg-bottomnav">
    <button class="eg-navbtn active" data-view="inicio">Inicio</button>
    <button class="eg-navbtn" data-view="catalogo">Catálogo</button>
    <button class="eg-navbtn" data-view="marcas">Marcas</button>
  </nav>

  <!-- ===== Filter bottom sheet ===== -->
  <div class="eg-sheet-overlay eg-hidden" id="sheetOverlay">
    <div class="eg-sheet" id="filtrosSheet">
      <div class="eg-sheet-handle"></div>
      <div class="eg-sheet-head">
        <h2 class="eg-sheet-title">Filtros</h2>
        <button class="eg-sheet-clear" id="btnLimpiarFiltros">Limpiar</button>
      </div>

      <div class="eg-sheet-label">TIPO</div>
      <div class="eg-sheet-pills" id="tipoFilterPills"></div>

      <div class="eg-sheet-label">PRECIO</div>
      <div class="eg-range">
        <div class="eg-range-track">
          <div class="eg-range-fill" id="rangeFill"></div>
        </div>
        <input type="range" id="rangeMin" class="eg-range-input" step="10">
        <input type="range" id="rangeMax" class="eg-range-input" step="10">
      </div>
      <div class="eg-range-value" id="rangeValue"></div>

      <button class="eg-btn-apply" id="btnAplicarFiltros">Ver</button>
    </div>
  </div>

  <!-- ===== Detail modal ===== -->
  <div class="eg-modal-overlay eg-hidden" id="modalOverlay">
    <div class="eg-modal">
      <button class="eg-modal-close" id="modalClose">&times;</button>
      <div class="eg-modal-img-wrap">
        <img id="modalImg" alt="">
      </div>
      <div class="eg-modal-body">
        <span class="eg-modal-tag" id="modalTipo"></span>
        <p class="eg-modal-brand" id="modalMarca"></p>
        <h3 class="eg-modal-name" id="modalNombre"></h3>
        <div class="eg-modal-prices">
          <span class="eg-price-original" id="modalPrecioOriginal"></span>
          <span class="eg-price-consumidor" id="modalPrecioConsumidor"></span>
        </div>
        <p class="eg-modal-desc" id="modalDescripcion"></p>
      </div>
    </div>
  </div>

</div>

<script src="data.js?v=20260810b"></script>
<script src="app.js?v=20260810b"></script>
</body>
</html>
